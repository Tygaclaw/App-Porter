name: Build App Porter APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 (API 36) platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build the APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AppPorter.apk

      - name: Save APK as a build download
        uses: actions/upload-artifact@v4
        with:
          name: AppPorter-apk
          path: AppPorter.apk

      - name: Publish APK to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: App Porter build ${{ github.run_number }}
          files: AppPorter.apk
